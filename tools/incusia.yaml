name: Incusia
url: https://incusia.com
description: Invoicing for freelancers and contractors with unlimited invoices and clients from $9 a
  month, automatic reminders, a pay button on each invoice and a locked price.
category: productivity
tags:
  - invoicing
  - freelancers
  - payment-reminders
  - online-payments
