badge_url: https://incusia.com
sample_use_case: A freelance graphic designer uses Incusia to create and send invoices to clients.
  They input client details, service descriptions, and rates, then send the invoice directly from
  the platform. Incusia automatically sends payment reminders and allows clients to pay directly
  through a button on the invoice.
