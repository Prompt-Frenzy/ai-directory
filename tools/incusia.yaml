pricing: subscription
pricing_detail: Starter $9/mo, Pro $29/mo, Lifetime $99 once. 7-day trial, no card needed
key_features:
  - Unlimited invoices and clients on every plan
  - The monthly price you sign up at is locked in the Terms of Service
  - See when an invoice is delivered and opened
  - Automatic payment reminder on day 3 if unpaid
  - Clients pay by card, Apple Pay or bank transfer from a button on the invoice
  - Estimates the client signs in the browser
works_with:
  - stripe
  - apple pay
