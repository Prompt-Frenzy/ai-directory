sample_use_case: A clinical trial manager uses Hive Prospect to compare the cost and enrollment
  feasibility of different protocol designs across various geographic regions. They input trial
  parameters like patient inclusion criteria and desired endpoints, and the tool outputs cost
  estimates, projected enrollment timelines, and identifies regions with optimal patient
  populations. This helps them make informed decisions about trial design and site selection.
