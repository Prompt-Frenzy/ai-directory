name: update-readme

on:
  push:
    branches: [main]
    paths:
      - "tools/**.yaml"
      - "seed/**.yaml"
      - "removed/**.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DIRECTORY_BOT_PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Regenerate README
        run: node scripts/regenerate-readme.mjs

      - name: Commit & push if changed
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "pf-directory-bot"
          git config user.email "290044263+pf-directory-bot@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate README catalog $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
